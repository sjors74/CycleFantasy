trigger:
- develop

pr:
  branches:
    include:
      - master
      - develop

resources:
  pipelines:
  - pipeline: api
    source: CycleFantasy-API
    trigger:
      branches:
        include:
        - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
- stage: WaitForApi
  displayName: Wait for API pipeline (PR only)
  condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))

  jobs:
  - job: DebugApiBuilds
    displayName: 'Debug: list recent API builds'
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: PowerShell@2
      displayName: 'List recent API builds'
      inputs:
        targetType: 'inline'
        script: |
          $headers = @{ Authorization = "Bearer $(System.AccessToken)" }
          $url = "https://dev.azure.com/sjorsstevens74/CycleFantasy/_apis/build/builds?definitions=4&`$top=5&queryOrderBy=queueTime-descending&api-version=7.1"
          $result = Invoke-RestMethod -Uri $url -Headers $headers
          Write-Host "Current PR number: $(System.PullRequest.PullRequestNumber)"
          Write-Host "Target branch: $(System.PullRequest.TargetBranch)"
          $result.value | Select-Object id, status, result, sourceBranch, reason | Format-Table -AutoSize

  - job: WaitForApiBuild
    displayName: Wait for CycleFantasy-API build on same PR
    dependsOn: DebugApiBuilds
    pool: server
    timeoutInMinutes: 60
    steps:

    - task: InvokeRESTAPI@1
      displayName: 'Poll CycleFantasy-API build status (agentless)'
      inputs:
        connectionType: 'connectedServiceName'
        serviceConnection: 'azure-devops-rest-readonly'
        method: 'GET'
        urlSuffix: '/CycleFantasy/_apis/build/builds?definitions=4&branchName=refs/pull/$(System.PullRequest.PullRequestNumber)/merge&$top=1&queryOrderBy=queueTime-descending&api-version=7.1'
        waitForCompletion: 'true'
        successCriteria: 'and(eq(root[''count''], 1), eq(root[''value''][0][''status''], ''completed''), eq(root[''value''][0][''result''], ''succeeded''))'

- stage: Build
  displayName: Build WebApp
  dependsOn:
  - WaitForApi
  condition: and(in(dependencies.WaitForApi.result, 'Succeeded', 'Skipped'), not(canceled()))

  jobs:
  - job: BuildWeb
    displayName: Build WebApp

    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore WebApp/WebApp.csproj
      displayName: 'Restore'

    - script: dotnet build WebApp/WebApp.csproj --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    - script: >
        dotnet publish WebApp/WebApp.csproj
        -c $(buildConfiguration)
        -o $(Build.ArtifactStagingDirectory)/web
      displayName: 'Publish WebApp'

    - task: ArchiveFiles@2
      displayName: 'Archive WebApp'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/web.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/web.zip'
      artifact: web

- stage: Deploy
  displayName: Deploy WebApp
  dependsOn: Build

  condition: and(succeeded(), eq(variables['Build.Reason'], 'ResourceTrigger'), eq(variables['Resources.TriggeringAlias'], 'api'),  eq(variables['resources.pipeline.api.sourceBranch'], 'refs/heads/master'))

  jobs:
  - job: DeployWeb
    displayName: Deploy WebApp

    steps:

    - download: current
      artifact: web

    - task: AzureWebApp@1
      displayName: 'Deploy WebApp'
      inputs:
        azureSubscription: 'azure-cyclefantasy-prod'
        appName: 'WebApp20250508172648'
        package: '$(Pipeline.Workspace)/web/web.zip'