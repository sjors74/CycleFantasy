trigger:
- develop

pr:
  branches:
    include:
      - master
      - develop

resources:
  pipelines:
  - pipeline: api
    source: CycleFantasy-API
    trigger:
      branches:
        include:
        - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

stages:
- stage: WaitForApi
  displayName: Wait for API pipeline (PR only)
  condition: eq(variables['Build.Reason'], 'PullRequest')

  jobs:
  - job: WaitForApiBuild
    displayName: Wait for CycleFantasy-API build on same commit
    timeoutInMinutes: 30
    steps:

    - task: PowerShell@2
      displayName: 'Poll CycleFantasy-API build status'
      inputs:
        targetType: 'inline'
        script: |
          $org = "sjorsstevens74"
          $project = "CycleFantasy"
          $apiPipelineName = "CycleFantasy-API"
          $commit = "$(Build.SourceVersion)"
          $headers = @{ Authorization = "Bearer $(System.AccessToken)" }

          Write-Host "Looking up definition id for pipeline '$apiPipelineName'..."
          $defUrl = "https://dev.azure.com/$org/$project/_apis/build/definitions?name=$apiPipelineName&api-version=7.1"
          $defResult = Invoke-RestMethod -Uri $defUrl -Headers $headers -Method Get

          if ($defResult.count -eq 0) {
            Write-Error "Could not find pipeline definition named '$apiPipelineName'."
            exit 1
          }
          $defId = $defResult.value[0].id
          Write-Host "Found definition id: $defId"

          $maxAttempts = 60
          $delaySeconds = 30
          $attempt = 0
          $found = $false
          $result = $null

          while ($attempt -lt $maxAttempts -and -not $found) {
            $attempt++
            $buildsUrl = "https://dev.azure.com/$org/$project/_apis/build/builds?definitions=$defId&`$top=20&queryOrderBy=queueTime-descending&api-version=7.1"
            $builds = Invoke-RestMethod -Uri $buildsUrl -Headers $headers -Method Get

            $match = $builds.value | Where-Object { $_.sourceVersion -eq $commit } | Select-Object -First 1

            if ($null -eq $match) {
              Write-Host "Attempt $attempt/$maxAttempts : no CycleFantasy-API build found yet for commit $commit. Waiting $delaySeconds s..."
              Start-Sleep -Seconds $delaySeconds
              continue
            }

            Write-Host "Attempt $attempt/$maxAttempts : found build $($match.buildNumber), status=$($match.status), result=$($match.result)"

            if ($match.status -eq "completed") {
              $found = $true
              $result = $match.result
            } else {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          if (-not $found) {
            Write-Error "Timed out waiting for CycleFantasy-API build to complete for commit $commit."
            exit 1
          }

          if ($result -ne "succeeded") {
            Write-Error "CycleFantasy-API build did not succeed (result: $result). Blocking WebApp build."
            exit 1
          }

          Write-Host "CycleFantasy-API build succeeded. Proceeding with WebApp build."
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

- stage: Build
  displayName: Build WebApp
  dependsOn:
  - WaitForApi
  condition: in(dependencies.WaitForApi.result, 'Succeeded', 'Skipped')

  jobs:
  - job: BuildWeb
    displayName: Build WebApp

    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore WebApp/WebApp.csproj
      displayName: 'Restore'

    - script: dotnet build WebApp/WebApp.csproj --configuration $(buildConfiguration) --no-restore
      displayName: 'Build'

    - script: >
        dotnet publish WebApp/WebApp.csproj
        -c $(buildConfiguration)
        -o $(Build.ArtifactStagingDirectory)/web
      displayName: 'Publish WebApp'

    - task: ArchiveFiles@2
      displayName: 'Archive WebApp'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/web'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/web.zip'
        replaceExistingArchive: true

    - publish: '$(Build.ArtifactStagingDirectory)/web.zip'
      artifact: web

- stage: Deploy
  displayName: Deploy WebApp
  dependsOn: Build

  condition: and(succeeded(), eq(variables['Build.Reason'], 'ResourceTrigger'), eq(variables['Resources.TriggeringAlias'], 'api'),  eq(variables['resources.pipeline.api.sourceBranch'], 'refs/heads/master'))

  jobs:
  - job: DeployWeb
    displayName: Deploy WebApp

    steps:

    - download: current
      artifact: web

    - task: AzureWebApp@1
      displayName: 'Deploy WebApp'
      inputs:
        azureSubscription: 'azure-cyclefantasy-prod'
        appName: 'WebApp20250508172648'
        package: '$(Pipeline.Workspace)/web/web.zip'