trigger:
- master
- develop

pr:
  branches:
    include:
      - master
      - develop

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  coverageThreshold: 70

stages:

- stage: BuildAndTest
  displayName: Build and Test API

  jobs:
  - job: DetectChanges
    displayName: Detect relevant changes
    steps:
    - checkout: self
      fetchDepth: 0

    - task: PowerShell@2
      name: detect
      displayName: 'Check for relevant path changes'
      inputs:
        targetType: 'inline'
        script: |
          $paths = @(
            "WebCycle/",
            "CycleManager.Tests.Unit/Api/",
            "CycleManager.Tests.Unit/Services/",
            "CycleManager.Tests.Integration/Api/",
            "CycleManager.Tests.Integration/DataAccess/",
            "CycleManager.Tests.Integration/Helpers/"
          )

          if ("$(Build.Reason)" -eq "PullRequest") {
            git fetch origin $(System.PullRequest.TargetBranch) --depth=1 2>$null
            $diff = git diff --name-only "origin/$(System.PullRequest.TargetBranch)...HEAD"
          } else {
            $diff = git diff --name-only HEAD~1 HEAD 2>$null
          }

          Write-Host "Changed files:`n$diff"

          $relevant = $false
          foreach ($file in $diff) {
            foreach ($p in $paths) {
              if ($file -like "$p*") {
                $relevant = $true
                break
              }
            }
            if ($relevant) { break }
          }

          if (-not $diff) {
            Write-Host "No diff detected (e.g. first run), defaulting to run."
            $relevant = $true
          }

          Write-Host "Relevant changes: $relevant"
          Write-Host "##vso[task.setvariable variable=shouldRun;isOutput=true]$relevant"

  - job: BuildTest
    displayName: Build and Test API
    dependsOn: DetectChanges
    condition: eq(dependencies.DetectChanges.outputs['detect.shouldRun'], 'True')
    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore WebCycle/WebCycleApi.csproj
      displayName: 'Restore Api'

    - script: dotnet build WebCycle/WebCycleApi.csproj --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Api'

    - script: dotnet restore CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj
      displayName: 'Restore unit tests'

    - script: >
        dotnet build CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj 
        --configuration $(buildConfiguration) 
        --no-restore
      displayName: 'Build unit tests'

    - script: >
        dotnet test CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --settings CodeCoverage.Api.runsettings
        --filter "FullyQualifiedName~CycleManager.Tests.Unit.Api|FullyQualifiedName~CycleManager.Tests.Unit.Services"
      displayName: 'Run unit tests (Api + Services)'

    - script: dotnet restore CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
      displayName: 'Restore integration tests'

    - script: >
        dotnet build CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
        --configuration $(buildConfiguration)
        --no-restore
      displayName: 'Build integration tests'

    - script: >
        dotnet test CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=integration-test-results.trx"
        --collect:"XPlat Code Coverage"
        --settings CodeCoverage.Api.runsettings
        --filter "FullyQualifiedName~CycleManager.Tests.Integration.Api|FullyQualifiedName~CycleManager.Tests.Integration.DataAccess|FullyQualifiedName~CycleManager.Tests.Integration.Helpers|FullyQualifiedName~CycleManager.Tests.Helpers"
      displayName: 'Run integration tests (Api + DataAccess + Helpers)'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Build.SourcesDirectory)'
        failTaskOnFailedTests: true
        testRunTitle: 'CycleFantasy Tests'

    - script: dotnet tool install --global dotnet-reportgenerator-globaltool
      displayName: 'Install ReportGenerator'

    - script: >
        reportgenerator
        "-reports:$(Build.SourcesDirectory)/**/TestResults/**/coverage.cobertura.xml"
        "-targetdir:$(Build.SourcesDirectory)/CodeCoverage"
        "-reporttypes:Cobertura"
      displayName: 'Merge code coverage'

    - task: PowerShell@2
      displayName: 'Enforce code coverage threshold'
      inputs:
        targetType: 'inline'
        script: |
          [xml]$cobertura = Get-Content "$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml"
          $lineRate = [double]$cobertura.coverage.'line-rate' * 100
          $lineRate = [math]::Round($lineRate, 2)
          Write-Host "Line coverage: $lineRate% (threshold: $(coverageThreshold)%)"
          if ($lineRate -lt $(coverageThreshold)) {
            Write-Error "Code coverage $lineRate% is below the required threshold of $(coverageThreshold)%."
            exit 1
          }

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage'
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml'
        failIfCoverageEmpty: true

    - task: CopyFiles@2
      displayName: 'Copy coverage for combined report'
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)/CodeCoverage'
        contents: 'Cobertura.xml'
        targetFolder: '$(Build.ArtifactStagingDirectory)/coverage-api'

    - publish: '$(Build.ArtifactStagingDirectory)/coverage-api'
      artifact: coverage-api
      displayName: 'Publish coverage artifact (Api)'

- stage: DeployApi
  displayName: Deploy API
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

  jobs:
  - job: Deploy
    steps:

    - script: >
        dotnet publish WebCycle/WebCycleApi.csproj
        -c $(buildConfiguration)
        -o $(Build.ArtifactStagingDirectory)/api
      displayName: Publish API

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/api'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/api.zip'

    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'azure-cyclefantasy-prod'
        appName: 'WebCycleApi20250508145015'
        package: '$(Build.ArtifactStagingDirectory)/api.zip'