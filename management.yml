trigger:
  branches:
    include:
      - master
      - develop

pr:
  branches:
    include:
      - master
      - develop
  paths:
    include:
      - ManagementApp/*
      - CycleManager.Tests.Unit/Manager/*
      - CycleManager.Tests.Unit/Services/*
      - CycleManager.Tests.Integration/Manager/*
      - CycleManager.Tests.Integration/DataAccess/*
      - CycleManager.Tests.Integration/Helpers/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepository: 'cyclemanager'
  containerRegistry: 'cyclingregistry123.azurecr.io'
  dockerRegistryServiceConnection: 'cyclingregistry123'
  azureSubscription: 'azure-cyclefantasy-prod'
  resourceGroup: 'rg_cycledb'
  containerAppName: 'cyclingapp'
  tag: '$(Build.BuildId)'
  buildConfiguration: 'Release'
  coverageThreshold: 70

stages:

# =====================================
# Build and test Management App
# =====================================

- stage: BuildAndTest
  displayName: Build and Test Management App

  jobs:
  - job: BuildTest
    displayName: Build and Test Management App
    steps:

    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj
      displayName: 'Restore unit tests'

    - script: >
        dotnet build CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj
        --configuration $(buildConfiguration)
        --no-restore
      displayName: 'Build unit tests'

    - script: >
        dotnet test CycleManager.Tests.Unit/CycleManager.Tests.Unit.csproj
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=test-results.trx"
        --collect:"XPlat Code Coverage"
        --settings CodeCoverage.runsettings
        --filter "FullyQualifiedName~CycleManager.Tests.Unit.Manager|FullyQualifiedName~CycleManager.Tests.Unit.Services"
      displayName: 'Run unit tests (Manager + Services)'

    - script: dotnet restore CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
      displayName: 'Restore integration tests'

    - script: >
        dotnet build CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
        --configuration $(buildConfiguration)
        --no-restore
      displayName: 'Build integration tests'

    - script: >
        dotnet test CycleManager.Tests.Integration/CycleManager.Tests.Integration.csproj
        --configuration $(buildConfiguration)
        --no-build
        --logger "trx;LogFileName=integration-test-results.trx"
        --collect:"XPlat Code Coverage"
        --settings CodeCoverage.runsettings
        --filter "FullyQualifiedName~CycleManager.Tests.Integration.Manager|FullyQualifiedName~CycleManager.Tests.Integration.DataAccess|FullyQualifiedName~CycleManager.Tests.Integration.Helpers|FullyQualifiedName~CycleManager.Tests.Helpers"
      displayName: 'Run integration tests (Manager + DataAccess + Helpers)'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Build.SourcesDirectory)'
        failTaskOnFailedTests: true
        testRunTitle: 'CycleFantasy Management App Tests'

    - script: dotnet tool install --global dotnet-reportgenerator-globaltool
      displayName: 'Install ReportGenerator'

    - script: >
        reportgenerator
        "-reports:$(Build.SourcesDirectory)/**/TestResults/**/coverage.cobertura.xml"
        "-targetdir:$(Build.SourcesDirectory)/CodeCoverage"
        "-reporttypes:Cobertura"
      displayName: 'Merge code coverage'

    - task: PowerShell@2
      displayName: 'Enforce code coverage threshold'
      inputs:
        targetType: 'inline'
        script: |
          [xml]$cobertura = Get-Content "$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml"
          $lineRate = [double]$cobertura.coverage.'line-rate' * 100
          $lineRate = [math]::Round($lineRate, 2)
          Write-Host "Line coverage: $lineRate% (threshold: $(coverageThreshold)%)"
          if ($lineRate -lt $(coverageThreshold)) {
            Write-Error "Code coverage $lineRate% is below the required threshold of $(coverageThreshold)%."
            exit 1
          }

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish code coverage'
      inputs:
        summaryFileLocation: '$(Build.SourcesDirectory)/CodeCoverage/Cobertura.xml'
        failIfCoverageEmpty: true

    - task: CopyFiles@2
      displayName: 'Copy coverage for combined report'
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)/CodeCoverage'
        contents: 'Cobertura.xml'
        targetFolder: '$(Build.ArtifactStagingDirectory)/coverage-management'

    - publish: '$(Build.ArtifactStagingDirectory)/coverage-management'
      artifact: coverage-management
      displayName: 'Publish coverage artifact (Management)'

# =====================================
# Build docker image
# =====================================

- stage: Build
  displayName: Build Management Docker Image
  dependsOn: BuildAndTest

  jobs:
  - job: BuildDocker
    displayName: Build Docker image

    steps:

    - checkout: self

    - task: Docker@2
      displayName: 'Build Docker image'
      inputs:
        command: build
        repository: $(imageRepository)
        dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(tag)

    # ==========================================
    # Push + Deploy
    # Alleen op master
    # ==========================================

- stage: Deploy
  displayName: Push and Deploy Management
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))

  jobs:
  - job: DeployContainerApp
    displayName: Push and Deploy Container App

    steps:

    - checkout: self

    # Build opnieuw omdat deze job op een nieuwe agent draait
    - task: Docker@2
      displayName: 'Build Docker image for deployment'
      inputs:
        command: build
        repository: '$(containerRegistry)/$(imageRepository)'
        dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(tag)
  
    - task: Docker@2
      displayName: 'Push Docker image to ACR'
      inputs:
        command: push
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    # Update Azure Container App
    - task: AzureCLI@2
      displayName: 'Deploy Container App'
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name $(containerAppName) \
            --resource-group $(resourceGroup) \
            --image $(containerRegistry)/$(imageRepository):$(tag)
